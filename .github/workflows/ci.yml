name: ShopFlow CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  unit-and-contracts:
    name: Unit, integration and contract tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx ruff
      - name: Compile Python sources
        run: python -m compileall -q app alembic tests
      - name: Lint
        run: ruff check .
      - name: Run SQLite test suite
        run: pytest -q

  postgres-and-e2e:
    name: PostgreSQL migrations, integration and live E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shopflow_test
          POSTGRES_USER: shopflow
          POSTGRES_PASSWORD: shopflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopflow -d shopflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://shopflow:shopflow@localhost:5432/shopflow_test
      SHOPFLOW_TEST_DATABASE_URL: postgresql+psycopg://shopflow:shopflow@localhost:5432/shopflow_test
      SECRET_KEY: ci-secret-key-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx
      - name: Upgrade database from empty to head
        run: alembic upgrade head
      - name: Check migration/model drift
        run: alembic check
      - name: Validate full downgrade and re-upgrade
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Run integration suite on PostgreSQL
        run: pytest -q --ignore=tests/e2e
      - name: Reset migrated database for live E2E
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Start real ShopFlow HTTP server
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/shopflow-uvicorn.log 2>&1 &
          echo $! > /tmp/shopflow-uvicorn.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shopflow-uvicorn.log
          exit 1
      - name: Run live HTTP E2E against PostgreSQL
        env:
          SHOPFLOW_E2E_BASE_URL: http://127.0.0.1:8000
        run: pytest -q tests/e2e/test_live_api.py
      - name: Show API logs on failure
        if: failure()
        run: cat /tmp/shopflow-uvicorn.log || true
