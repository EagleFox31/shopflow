[tool.poetry]
name = "shopflow"
version = "0.2.0"
description = "Multi-shop commerce backend built with FastAPI, SQLAlchemy and a domain service layer"
authors = ["Jennifer Aka'a"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
sqlalchemy = ">=2.0,<3.0"
psycopg = { version = ">=3.2,<4.0", extras = ["binary"] }
pydantic-settings = ">=2.5,<3.0"
email-validator = ">=2.2,<3.0"
alembic = ">=1.13,<2.0"
pyjwt = ">=2.9,<3.0"
argon2-cffi = ">=23.1,<26.0"
python-multipart = ">=0.0.9,<1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
httpx = ">=0.27,<1.0"
ruff = ">=0.8,<1.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the gate focused on correctness-oriented checks. FastAPI legitimately
# calls Depends()/Query() in default arguments and SQLAlchemy relationships use
# quoted forward references, so those framework patterns are configured below.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]
"tests/conftest.py" = ["E402"]
