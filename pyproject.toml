[tool.poetry]
name = "shopflow"
version = "0.1.0"
description = "Training e-commerce backend built with FastAPI and PostgreSQL"
authors = ["Jennifer Aka'a"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
sqlalchemy = ">=2.0,<3.0"
psycopg = { version = ">=3.2,<4.0", extras = ["binary"] }
pydantic-settings = ">=2.5,<3.0"
alembic = ">=1.13,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
httpx = ">=0.27,<1.0"
ruff = ">=0.8,<1.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
